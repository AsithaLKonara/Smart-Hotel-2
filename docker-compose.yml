version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: smarthotel-postgres
    environment:
      POSTGRES_DB: smarthotel_prod
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: smarthotel-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smarthotel-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL_POSTGRES=postgresql://postgres:postgrespassword@postgres:5432/smarthotel_prod
      - REDIS_URL=redis://redis:6379
      - NEXTAUTH_SECRET=productionsecret321
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
