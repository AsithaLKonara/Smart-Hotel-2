<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#d97706;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b45309;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="overlayGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.7" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  <rect width="1200" height="630" fill="url(#overlayGradient)"/>
  
  <!-- Pattern Overlay -->
  <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="2" fill="white" opacity="0.1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dots)"/>
  
  <!-- Hotel Icon/Logo -->
  <g transform="translate(120, 180)">
    <rect x="0" y="0" width="120" height="120" rx="20" fill="white" opacity="0.95"/>
    <text x="60" y="80" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#f59e0b" text-anchor="middle">🏨</text>
  </g>
  
  <!-- Main Title -->
  <text x="280" y="260" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="white">
    SmartHotel
  </text>
  
  <!-- Subtitle -->
  <text x="280" y="320" font-family="Arial, sans-serif" font-size="36" fill="white" opacity="0.9">
    Luxury Hotel Management System
  </text>
  
  <!-- Features -->
  <g transform="translate(280, 370)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="24" fill="white" opacity="0.85">
      ✓ Smart Booking System
    </text>
    <text x="0" y="40" font-family="Arial, sans-serif" font-size="24" fill="white" opacity="0.85">
      ✓ Restaurant Ordering
    </text>
    <text x="0" y="80" font-family="Arial, sans-serif" font-size="24" fill="white" opacity="0.85">
      ✓ Real-time Management
    </text>
  </g>
  
  <!-- Bottom Badge -->
  <rect x="950" y="500" width="200" height="80" rx="10" fill="white" opacity="0.15"/>
  <text x="1050" y="535" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">
    5-STAR
  </text>
  <text x="1050" y="565" font-family="Arial, sans-serif" font-size="18" fill="white" text-anchor="middle" opacity="0.9">
    EXPERIENCE
  </text>
</svg>