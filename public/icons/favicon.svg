<svg width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#iconGradient)"/>
  
  <!-- Hotel Building -->
  <g transform="translate(106, 80)">
    <!-- Main Building -->
    <rect x="0" y="120" width="300" height="280" rx="10" fill="white" opacity="0.95"/>
    
    <!-- Windows Row 1 -->
    <rect x="30" y="150" width="40" height="50" rx="5" fill="#d97706"/>
    <rect x="90" y="150" width="40" height="50" rx="5" fill="#d97706"/>
    <rect x="150" y="150" width="40" height="50" rx="5" fill="#d97706"/>
    <rect x="210" y="150" width="40" height="50" rx="5" fill="#d97706"/>
    
    <!-- Windows Row 2 -->
    <rect x="30" y="220" width="40" height="50" rx="5" fill="#d97706"/>
    <rect x="90" y="220" width="40" height="50" rx="5" fill="#d97706"/>
    <rect x="150" y="220" width="40" height="50" rx="5" fill="#d97706"/>
    <rect x="210" y="220" width="40" height="50" rx="5" fill="#d97706"/>
    
    <!-- Entrance -->
    <rect x="110" y="310" width="80" height="90" rx="5" fill="#b45309"/>
    <circle cx="150" cy="355" r="8" fill="#fbbf24"/>
    
    <!-- Roof -->
    <path d="M -20 120 L 150 40 L 320 120 Z" fill="white" opacity="0.9"/>
    
    <!-- Flag -->
    <rect x="140" y="10" width="6" height="45" fill="white"/>
    <path d="M 146 15 L 200 25 L 146 35 Z" fill="#fbbf24"/>
  </g>
  
  <!-- Letter S (SmartHotel) -->
  <text x="256" y="480" font-family="Arial, sans-serif" font-size="140" font-weight="bold" fill="white" text-anchor="middle">
    S
  </text>
</svg>

